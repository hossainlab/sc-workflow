[project]
name        = "sc-workflow"
version     = "0.1.0"
description = "Complete single-cell RNA-seq analysis workflow — QC through CNV"
authors     = ["Jubayer Hossain"]
license     = "MIT"
readme      = "README.md"
channels    = ["conda-forge", "bioconda"]
platforms   = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# ── Base Python ────────────────────────────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.13"

# ── PyPI packages (all analysis scripts) ──────────────────────────────────────
[pypi-dependencies]
# Core
marimo           = ">=0.10.0"
scanpy           = ">=1.10.0"
anndata          = ">=0.10.8"
numpy            = ">=1.26.0"
pandas           = ">=2.2.0"
scipy            = ">=1.13.0"
matplotlib       = ">=3.9.0"
seaborn          = ">=0.13.2"
plotly           = ">=5.22.0"
kaleido          = ">=0.2.1"

# QC & Preprocessing
scrublet         = ">=0.2.3"
doubletdetection = ">=4.2"

# Batch Correction / Integration
harmonypy        = ">=0.0.9"
scvi-tools       = ">=1.1.6"
bbknn            = ">=1.6.0"

# Dimensionality Reduction
umap-learn       = ">=0.5.6"
pynndescent      = ">=0.5.13"

# Cell Type Annotation
celltypist       = ">=1.6.3"

# Differential Expression
pydeseq2         = ">=0.4.11"
diffxpy          = ">=0.7.4"
decoupler-py     = ">=1.8.0"
gseapy           = ">=1.1.4"

# Trajectory Analysis
cellrank         = ">=2.0.5"
scvelo           = ">=0.3.2"
scFates          = ">=1.0.4"

# Cell-Cell Communication
liana-py         = ">=1.3.0"

# CNV Analysis
infercnvpy       = ">=0.4.3"

# Co-expression Networks
PyWGCNA          = ">=2.0.8"

# Utilities
rich             = ">=13.7.0"
tqdm             = ">=4.66.4"
h5py             = ">=3.11.0"
tables           = ">=3.9.2"
leidenalg        = ">=0.10.2"
python-igraph    = ">=0.11.6"

# Local utility package (editable install)
sc-workflow      = { path = "src", editable = true }

# ── Genomics feature — Linux / macOS only ─────────────────────────────────────
# Provides: FastQC, MultiQC, SRA Toolkit, samtools
# Used only by scripts/00_fastq_to_counts.py
# Install with: pixi install -e genomics

[feature.genomics.dependencies]
fastqc    = ">=0.12"
multiqc   = ">=1.21"
sra-tools = ">=3.0"
samtools  = ">=1.19"

[environments]
default  = { features = [],           solve-group = "default"  }
genomics = { features = ["genomics"], solve-group = "genomics" }

# ── Convenience tasks ──────────────────────────────────────────────────────────
[tasks]
# Edit a script in your default Python editor, then run it
qc           = "python scripts/01_qc_filtering.py"
integrate    = "python scripts/02_integration_clustering.py"
annotate     = "python scripts/03_cell_annotation.py"
de           = "python scripts/04_differential_expression.py"
trajectory   = "python scripts/05_trajectory_analysis.py"
communication = "python scripts/06_cell_communication.py"
cnv          = "python scripts/07_cnv_analysis.py"
coexpression = "python scripts/08_coexpression_networks.py"

# Run the full analysis pipeline in sequence (scripts 01-08)
pipeline = { depends-on = ["qc", "integrate", "annotate", "de",
                            "trajectory", "communication", "cnv",
                            "coexpression"] }
